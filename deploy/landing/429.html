<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Please wait &middot; Samruddhi Fire</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { text-align: center; width: 100%; max-width: 30rem; }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 7vw, 2rem);
    font-weight: 700;
    line-height: 1.2;
  }
  p {
    margin: 0.75rem 0 2rem;
    font-size: clamp(0.95rem, 4vw, 1.0625rem);
    line-height: 1.5;
    color: #444444;
  }
  a.btn {
    display: inline-block;
    padding: 0.85rem 2rem;
    background: #D7141A;
    color: #ffffff;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 4px;
  }
  a.btn:hover, a.btn:focus { background: #b31015; }
  a.btn:focus-visible { outline: 3px solid #1a1a1a; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Please wait</h1>
  <p>Sign-in from this network has been paused briefly. Wait about a minute, then try again.</p>
  <a class="btn" href="/login">Back to sign in</a>
</main>
</body>
</html>
